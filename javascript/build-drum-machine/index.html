<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css">
    <title>Drum Machine</title>
</head>

<body>
    <!-- https://www.freecodecamp.org/learn/javascript-v9/lab-drum-machine/build-drum-machine -->
    <div id="drum-machine">
        <div id="pad-bank">
            <div class="drum-pad">
                <p>Q</p><audio id="Q" src="media/Q.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>W</p><audio id="W" src="media/W.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>E</p><audio id="E" src="media/E.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>A</p><audio id="A" src="media/A.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>S</p><audio id="S" src="media/S.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>D</p><audio id="D" src="media/D.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>Z</p><audio id="Z" src="media/Z.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>X</p><audio id="X" src="media/X.mp3" class="clip"></audio>
            </div>
            <div class="drum-pad">
                <p>C</p><audio id="C" src="media/C.mp3" class="clip"></audio>
            </div>
        </div>
        <p id="display">
        </p>
    </div>

    <script src="script.js"></script>
</body>

</html>
